<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meeth@ai-projects:~$</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --primary: #00ff88;
      --muted: #4ade80;
      --text: #e2e8f0;
      --dim: #4b5563;
      --error: #f87171;
      --prompt: #00ff88;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Title bar */
    #titlebar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .dots { display: flex; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red    { background: #ff5f57; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green  { background: #28c840; }
    #titlebar span {
      color: var(--dim);
      font-size: 12px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Terminal body */
    #terminal {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #terminal::-webkit-scrollbar { width: 6px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .line { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .prompt-line { display: flex; align-items: flex-start; gap: 0; }
    .prompt-text { color: var(--prompt); flex-shrink: 0; }
    .cmd-echo { color: var(--text); }

    .out-text   { color: var(--text); }
    .out-green  { color: var(--primary); }
    .out-muted  { color: var(--muted); }
    .out-dim    { color: var(--dim); }
    .out-error  { color: var(--error); }
    .out-yellow { color: #fbbf24; }

    /* Input row */
    #input-row {
      display: flex;
      align-items: center;
      gap: 0;
      margin-top: 4px;
      flex-shrink: 0;
      padding: 0 24px 20px;
    }
    #input-prompt { color: var(--prompt); flex-shrink: 0; }
    #cmd-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: inherit;
      flex: 1;
      caret-color: var(--primary);
    }

    /* Blinking cursor for boot animation */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--primary);
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 1px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .tag {
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 0 4px;
      font-size: 11px;
      margin-right: 4px;
    }

    .separator { color: var(--border); }

    /* Theme overrides */
    body.theme-blue-matrix {
      --bg: #000814; --surface: #001628; --border: #003049;
      --primary: #00b4d8; --muted: #0077b6; --text: #caf0f8;
      --dim: #023e8a; --prompt: #00b4d8;
    }
    body.theme-ubuntu {
      --bg: #300a24; --surface: #3a0e2e; --border: #5a1a48;
      --primary: #e95420; --muted: #f07d55; --text: #eeeeec;
      --dim: #7a3558; --prompt: #e95420;
    }
    body.theme-espresso {
      --bg: #1a1210; --surface: #231916; --border: #3d2b26;
      --primary: #d4a76a; --muted: #b8864e; --text: #ede0d4;
      --dim: #6b4c3b; --prompt: #d4a76a;
    }
    body.theme-amber {
      --bg: #0d0900; --surface: #150f00; --border: #2a1e00;
      --primary: #ffb300; --muted: #e69500; --text: #fff3cc;
      --dim: #4d3800; --prompt: #ffb300;
    }
  </style>
</head>
<body>

<div id="titlebar">
  <div class="dots">
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
  </div>
  <span>meeth@ai-projects: ~</span>
</div>

<div id="terminal"></div>

<div id="input-row">
  <span id="input-prompt">meeth@ai-projects:~$ </span>
  <input id="cmd-input" type="text" autocomplete="off" spellcheck="false">
</div>

<script>
const COMMANDS = ['help','about','projects','skills','contact','themes','theme','clear','whoami','banner','home','cd'];

const PROJECTS = [
  {
    name: 'famai',
    status: 'wip',
    stack: [],
    desc: 'A WhatsApp AI assistant for Indian parents — set up by their kids in two minutes.',
    link: 'famai.in',
  },
];

const THEMES = ['green-goblin', 'blue-matrix', 'ubuntu', 'espresso', 'amber'];

const term = document.getElementById('terminal');
const input = document.getElementById('cmd-input');
const inputPrompt = document.getElementById('input-prompt');
let history = [], histIdx = -1, booting = true;

function print(html, cls = '') {
  const el = document.createElement('div');
  el.className = 'line ' + cls;
  el.innerHTML = html;
  term.appendChild(el);
  term.scrollTop = term.scrollHeight;
}

function blank() { print(''); }

function echoCmd(cmd) {
  const row = document.createElement('div');
  row.className = 'line prompt-line';
  row.innerHTML = `<span class="prompt-text">meeth@ai-projects:~$ </span><span class="cmd-echo">${esc(cmd)}</span>`;
  term.appendChild(row);
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function statusColor(s) {
  if (s === 'active')    return 'out-green';
  if (s === 'wip')       return 'out-yellow';
  if (s === 'archived')  return 'out-dim';
  return 'out-text';
}

function handle(raw) {
  const parts = raw.trim().split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');

  switch (cmd) {
    case '':
      break;

    case 'help':
      blank();
      print(`<span class="out-green">Available commands:</span>`);
      blank();
      print(`  <span class="out-green">whoami</span>      <span class="out-dim">—</span> who is this`);
      print(`  <span class="out-green">about</span>       <span class="out-dim">—</span> background & intro`);
      print(`  <span class="out-green">projects</span>    <span class="out-dim">—</span> list AI projects`);
      print(`  <span class="out-green">cd</span> <span class="out-muted">[name]</span>      <span class="out-dim">—</span> open project page`);
      print(`  <span class="out-green">skills</span>      <span class="out-dim">—</span> tech stack`);
      print(`  <span class="out-green">contact</span>     <span class="out-dim">—</span> get in touch`);
      print(`  <span class="out-green">themes</span>      <span class="out-dim">—</span> list color themes`);
      print(`  <span class="out-green">theme</span> <span class="out-muted">[name]</span>    <span class="out-dim">—</span> switch theme`);
      print(`  <span class="out-green">home</span>        <span class="out-dim">—</span> back to start`);
      print(`  <span class="out-green">clear</span>       <span class="out-dim">—</span> clear terminal`);
      blank();
      print(`  <span class="out-dim">Tab to autocomplete · ↑↓ for history</span>`);
      blank();
      break;

    case 'whoami':
      blank();
      print(`<span class="out-green">meeth maharana</span>`);
      print(`<span class="out-dim">building AI things. one experiment at a time.</span>`);
      blank();
      break;

    case 'about':
      blank();
      print(`<span class="out-green">// about</span>`);
      blank();
      print(`  Hey — I'm Meeth. I build AI-powered tools and experiments,`);
      print(`  mostly around LLMs, agents, and multimodal models.`);
      blank();
      print(`  This is my lab. Every project here is something I built`);
      print(`  to scratch an itch or answer a "what if".`);
      blank();
      print(`  <span class="out-dim">type</span> <span class="out-green">projects</span> <span class="out-dim">to see what's in the folder.</span>`);
      blank();
      break;

    case 'projects':
      if (arg) {
        const p = PROJECTS.find(p => p.name === arg.toLowerCase());
        if (!p) {
          blank();
          print(`<span class="out-error">project not found: ${esc(arg)}</span>`);
          print(`<span class="out-dim">run</span> <span class="out-green">projects</span> <span class="out-dim">to list available projects</span>`);
          blank();
        } else {
          blank();
          print(`<span class="out-green">// ${p.name}</span>`);
          blank();
          print(`  <span class="out-dim">desc:</span>    ${p.desc}`);
          if (p.stack.length) print(`  <span class="out-dim">stack:</span>   ${p.stack.join(' · ')}`);
          print(`  <span class="out-dim">status:</span>  <span class="${statusColor(p.status)}">[${p.status}]</span>`);
          print(`  <span class="out-dim">link:</span>    <span class="out-muted">${p.link}</span>`);
          blank();
        }
      } else {
        blank();
        print(`<span class="out-green">// ls projects/</span>`);
        blank();
        PROJECTS.forEach(p => {
          const tags = p.stack.slice(0,3).map(t => `<span class="tag">${t}</span>`).join('');
          print(`  <span class="out-green">drwxr-xr-x</span>  <span class="out-text">${p.name}/</span>  <span class="${statusColor(p.status)}">[${p.status}]</span>`);
          if (p.stack.length) print(`               ${tags}`);
          print(`               <span class="out-dim">${p.desc}</span>`);
          blank();
        });
        print(`  <span class="out-dim">type</span> <span class="out-green">cd [name]</span> <span class="out-dim">to open a project</span>`);
        blank();
        input.value = 'cd ';
        input.focus();
      }
      break;

    case 'cd':
      if (!arg) {
        print(`<span class="out-error">usage: cd [name]  —  run 'projects' to list names</span>`);
      } else {
        const p = PROJECTS.find(p => p.name === arg.toLowerCase());
        if (!p) {
          blank();
          print(`<span class="out-error">cd: ${esc(arg)}: no such project</span>`);
          print(`<span class="out-dim">run</span> <span class="out-green">projects</span> <span class="out-dim">to list available projects</span>`);
          blank();
        } else {
          blank();
          print(`<span class="out-green">opening ${p.name}/ ...</span>`);
          blank();
          setTimeout(() => window.open(`project.html?name=${encodeURIComponent(p.name)}`, '_blank'), 300);
        }
      }
      break;

    case 'home':
      term.innerHTML = '';
      booting = true;
      boot();
      break;

    case 'skills':
      blank();
      print(`<span class="out-green">// skills</span>`);
      blank();
      print(`  <span class="out-dim">languages:</span>   Python · TypeScript · SQL`);
      print(`  <span class="out-dim">ai/ml:</span>       LangChain · LlamaIndex · Transformers · Diffusers`);
      print(`  <span class="out-dim">models:</span>      Claude · GPT-4o · Gemini · Llama`);
      print(`  <span class="out-dim">infra:</span>       FastAPI · Next.js · Docker · Fly.io`);
      print(`  <span class="out-dim">stores:</span>      Pinecone · Supabase · Redis`);
      blank();
      break;

    case 'contact':
      blank();
      print(`<span class="out-green">// contact</span>`);
      blank();
      print(`  <span class="out-dim">email:</span>    <span class="out-muted">meeth.1234five@gmail.com</span>`);
      print(`  <span class="out-dim">github:</span>   <span class="out-muted">github.com/meeth</span>`);
      print(`  <span class="out-dim">twitter:</span>  <span class="out-muted">@meethmaharana</span>`);
      blank();
      break;

    case 'themes':
      blank();
      print(`<span class="out-green">// available themes</span>`);
      blank();
      THEMES.forEach(t => print(`  <span class="out-green">›</span> ${t}`));
      blank();
      print(`  <span class="out-dim">usage:</span> <span class="out-green">theme [name]</span>`);
      blank();
      break;

    case 'theme':
      if (!arg) {
        print(`<span class="out-error">usage: theme [name]  —  run 'themes' to list options</span>`);
      } else if (!THEMES.includes(arg.toLowerCase())) {
        print(`<span class="out-error">unknown theme: ${esc(arg)}</span>`);
      } else {
        const t = arg.toLowerCase();
        document.body.className = t === 'green-goblin' ? '' : `theme-${t}`;
        blank();
        print(`<span class="out-green">theme set: ${t}</span>`);
        blank();
      }
      break;

    case 'clear':
      term.innerHTML = '';
      break;

    case 'banner':
      printBanner();
      break;

    default:
      blank();
      print(`<span class="out-error">command not found: ${esc(cmd)}</span>  <span class="out-dim">type</span> <span class="out-green">help</span> <span class="out-dim">for available commands</span>`);
      blank();
  }
}

function printBanner() {
  blank();
  print(`<span class="out-green">  █████╗ ██╗    ███████╗███████╗ ██████╗ █████╗ ██████╗ ███████╗███████╗</span>`);
  print(`<span class="out-green"> ██╔══██╗██║    ██╔════╝██╔════╝██╔════╝██╔══██╗██╔══██╗██╔════╝██╔════╝</span>`);
  print(`<span class="out-green"> ███████║██║    █████╗  ███████╗██║     ███████║██████╔╝█████╗  ███████╗</span>`);
  print(`<span class="out-green"> ██╔══██║██║    ██╔══╝  ╚════██║██║     ██╔══██║██╔═══╝ ██╔══╝  ╚════██║</span>`);
  print(`<span class="out-green"> ██║  ██║██║    ███████╗███████║╚██████╗██║  ██║██║     ███████╗███████║</span>`);
  print(`<span class="out-green"> ╚═╝  ╚═╝╚═╝    ╚══════╝╚══════╝ ╚═════╝╚═╝  ╚═╝╚═╝     ╚══════╝╚══════╝</span>`);
  blank();
  print(`             <span class="out-dim">meeth's AI experiments lab  //  v1.0.0</span>`);
  blank();
}

// Boot sequence
async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typeOut(text, cls = 'out-dim') {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'line ' + cls;
    term.appendChild(el);
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);
    const iv = setInterval(() => {
      if (i < text.length) {
        el.insertBefore(document.createTextNode(text[i++]), cursor);
        term.scrollTop = term.scrollHeight;
      } else {
        clearInterval(iv);
        cursor.remove();
        resolve();
      }
    }, 28);
  });
}

async function boot() {
  await sleep(200);
  await typeOut('Initializing meeth@ai-projects...', 'out-dim');
  await sleep(300);
  print(`<span class="out-green">System ready.</span>`);
  blank();
  await sleep(200);
  print(`<span class="out-dim">┌──────────────────────────────────────────────┐</span>`);
  print(`<span class="out-dim">│</span>  <span class="out-green">meeth's AI experiments lab</span>  <span class="out-dim">// v1.0.0        │</span>`);
  print(`<span class="out-dim">│</span>  <span class="out-dim">type</span> <span class="out-green">help</span> <span class="out-dim">to get started                       │</span>`);
  print(`<span class="out-dim">└──────────────────────────────────────────────┘</span>`);
  blank();
  booting = false;
  input.focus();
}

// Input handling
input.addEventListener('keydown', e => {
  if (booting) { e.preventDefault(); return; }

  if (e.key === 'Enter') {
    const val = input.value;
    echoCmd(val);
    if (val.trim()) { history.unshift(val); histIdx = -1; }
    handle(val);
    input.value = '';

  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }

  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
    else { histIdx = -1; input.value = ''; }

  } else if (e.key === 'Tab') {
    e.preventDefault();
    const v = input.value.trim().toLowerCase();
    const parts = v.split(/\s+/);
    if (parts.length === 1) {
      const matches = COMMANDS.filter(c => c.startsWith(parts[0]));
      if (matches.length === 1) input.value = matches[0] + ' ';
      else if (matches.length > 1) {
        echoCmd(v);
        print(matches.join('  '), 'out-muted');
        blank();
      }
    } else if ((parts[0] === 'projects' || parts[0] === 'cd') && parts.length === 2) {
      const matches = PROJECTS.map(p => p.name).filter(n => n.startsWith(parts[1]));
      if (matches.length === 1) input.value = parts[0] + ' ' + matches[0];
    } else if (parts[0] === 'theme' && parts.length === 2) {
      const matches = THEMES.filter(t => t.startsWith(parts[1]));
      if (matches.length === 1) input.value = 'theme ' + matches[0];
    }
  }
});

// Keep input focused when clicking terminal
document.getElementById('terminal').addEventListener('click', () => input.focus());
document.getElementById('titlebar').addEventListener('click', () => input.focus());

boot();
</script>
</body>
</html>
